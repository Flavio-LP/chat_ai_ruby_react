global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "chatia-backend"
    static_configs:
      - targets: ["backend:3000"]
    metrics_path: "/metrics"
    scrape_interval: 30s

  - job_name: "chatia-sidekiq"
    static_configs:
      - targets: ["backend:3000"]
    metrics_path: "/sidekiq/metrics"
    scrape_interval: 30s

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

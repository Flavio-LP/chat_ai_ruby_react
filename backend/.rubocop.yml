inherit_gem:
  rubocop-rails-omakase: rubocop.yml

require:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  Exclude:
    - "db/schema.rb"
    - "bin/**/*"
    - "vendor/**/*"

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 150

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "config/routes.rb"

RSpec/MultipleExpectations:
  Max: 5

RSpec/ExampleLength:
  Max: 20

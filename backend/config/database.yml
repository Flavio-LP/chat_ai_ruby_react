default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
  # chatia,public — public necessário para que os tipos do pgvector sejam resolvidos
  schema_search_path: <%= ENV.fetch("DB_SCHEMA", "chatia") %>,public

development:
  <<: *default

test:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV.fetch("TEST_DATABASE_URL") { "postgresql://postgres:postgres@db-test:5432/chatia_test" } %>
  schema_search_path: public

production:
  <<: *default

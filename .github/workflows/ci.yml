name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend — RSpec / RuboCop / Brakeman / Security
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chatia_test
      REDIS_URL: redis://localhost:6379/0
      DEVISE_JWT_SECRET_KEY: test_secret_key_for_ci_only_not_real
      ABACUS_API_KEY: test_key
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: backend

      - name: Run db:create & db:migrate
        run: bin/rails db:create db:migrate

      - name: RSpec
        run: bundle exec rspec --format progress --format RspecJunitFormatter --out /tmp/rspec.xml
        continue-on-error: false

      - name: Upload RSpec results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rspec-results
          path: /tmp/rspec.xml

      - name: RuboCop
        run: bundle exec rubocop --parallel

      - name: Brakeman
        run: bundle exec brakeman --no-pager -q --exit-on-warn

      - name: bundle-audit
        run: |
          gem install bundler-audit
          bundle-audit check --update

  frontend:
    name: Frontend — Vitest / ESLint / npm audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm run test

      - name: ESLint
        run: npm run lint

      - name: npm audit
        run: npm audit --audit-level=high

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/ruby
            p/javascript
            p/typescript
            p/react
            p/owasp-top-ten
            p/secrets
            .semgrep/rules.yml
          auditOn: push

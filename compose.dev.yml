services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - chatia

  backend:
    build:
      context: ./backend
      target: build
    command: >
      sh -c "bundle install --quiet && rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA:-chatia}
      REDIS_URL: redis://redis:6379/0
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY}
      ABACUS_API_KEY: ${ABACUS_API_KEY}
      ABACUS_API_URL: ${ABACUS_API_URL}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-claude-sonnet-4-6}
      FRONTEND_URL: http://localhost:5173
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      RAILS_LOG_TO_STDOUT: "true"
      BUNDLE_PATH: /usr/local/bundle
      BUNDLE_WITHOUT: ""
    volumes:
      - ./backend:/rails
      - backend_bundle:/usr/local/bundle
      - backend_storage:/rails/storage
    ports:
      - "3000:3000"
    depends_on:
      - redis
    networks:
      - chatia
    extra_hosts:
      - "host.docker.internal:host-gateway"

  sidekiq:
    build:
      context: ./backend
      target: build
    command: >
      sh -c "bundle install --quiet && bundle exec sidekiq -C config/sidekiq.yml"
    environment:
      RAILS_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      DB_SCHEMA: ${DB_SCHEMA:-chatia}
      REDIS_URL: redis://redis:6379/0
      DEVISE_JWT_SECRET_KEY: ${DEVISE_JWT_SECRET_KEY}
      ABACUS_API_KEY: ${ABACUS_API_KEY}
      ABACUS_API_URL: ${ABACUS_API_URL}
      DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-claude-sonnet-4-6}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
      BUNDLE_PATH: /usr/local/bundle
      BUNDLE_WITHOUT: ""
    volumes:
      - ./backend:/rails
      - backend_bundle:/usr/local/bundle
      - backend_storage:/rails/storage
    depends_on:
      - redis
      - backend
    networks:
      - chatia
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - chatia

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - chatia

  db-test:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatia_test
    # Porta exposta no host apenas para acesso externo (IDE/psql). Comente se 5435 estiver ocupado.
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - chatia

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - chatia

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - chatia

volumes:
  backend_bundle:
  backend_storage:
  frontend_node_modules:
  redis_data:
  grafana_data:

networks:
  chatia:
    driver: bridge
